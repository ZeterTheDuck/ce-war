<!DOCTYPE html>
<!-- Database for users with write permission 
    Mapped to subdirectory "/write" -->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>CE War - Card Display</title>
    <link rel="stylesheet" type="text/css" th:href="@{~/style.css}">
    <link rel="icon" type="image/png" th:href="@{~/images/logo.png}">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script th:src="@{~/searchCardCollection.js}"></script>
</head>
<body>
    <div th:replace="~{fragments/header :: header}" />

    <div th:replace="~{fragments/card :: card-search(${cardDataArr})}"/>

    <script>

        // srcCardList is declared in the card-search fragment

        // Execute only when page is fully loaded
        $(document).ready(function() {
            $(".card-table").on("click", function () {
                const clickedCard = $(this);

                const cardName = clickedCard.attr("class").split(" ")[1];

                console.log(`Attempting to add card with ID ${cardName} to user's inventory...`);
                fetchCard(cardName);

            });
        })

        async function fetchCard(cardName) {
            try {
                const response = await fetch(`http://localhost:80/api/users/addCard/${cardName}`, { // Pauses until fetch resolves
                    method: "GET",
                    credentials: "include" });
                if (!response.ok) {
                    throw new Error(`Response Status: ${response.status}`);
                    return;
                }
            } catch (error) {
                console.error(error.message);
            }
            

        }
    </script>
</body>
</html>
