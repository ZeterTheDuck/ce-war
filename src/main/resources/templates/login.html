<!DOCTYPE html>
<!-- Login Page -->
<html xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <title>CE War - Login </title>
        <link rel="stylesheet" type="text/css" th:href="@{style.css}">
        <link rel="icon" type="image/png" th:href="@{images/logo.png}">
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    </head>
    <body>
        <!-- Replace this item with the container located at resources/templates/fragments/header that has the tag "th:fragment="header"" -->
        <div th:replace="~{fragments/header :: header}"/>

        <section class="login">
            <h1>User Login</h1>
            <form id="login-form" name="Login" action="#" th:action="@{/login}" method="post" enctype="utf8">
                <label for="username">Username:</label><br>
                <input type="text" id="username-input" name="username"/><br> <!-- th:field= replaces name= -->
                <label for="pass">Password:</label><br>
                <input type="password" id="password-input" name="password"/><br>
                <input type="submit" value="Submit"/>
            </form>
            <div th:if="${param.error}" class="error-msg">
                <p>Username or Password is incorrect</p>
            </div>
        </section>
    </body>

    <script th:inline="javascript">
        // Needed for Thymeleaf to be able to run this code
        /*<![CDATA[*/

        /*]]>*/
    </script>

</html>
