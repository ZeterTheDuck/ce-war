<!DOCTYPE html>
<html>
<head>
    <style>
        .parent-container {
        position: relative;
        width: 300px;
        height: 200px;
        border: 1px solid black;
        }

        .background-element {
        width: 100%;
        height: 100%;
        background-color: lightblue;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5;
        }

        .overlay-element {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 150px;
        height: 100px;
        background-color: lightcoral;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        }
    </style>
</head>
<body>
    <div class="parent-container">
        <div class="background-element">This is the background content.</div>
        <div class="overlay-element">This content overlays the background.</div>
    </div>
</body>
</html>
