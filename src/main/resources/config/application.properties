spring.config.import=.env[.properties]
spring.application.name=ce-war
server.port=80
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${CE_DB_URL}
spring.datasource.username=${CE_DB_USERNAME}
spring.datasource.password=${CE_DB_PASSWORD}
spring.datasource.driver-class-name=${CE_DB_DRIVER_CLASS}
spring.jpa.show-sql=false
# logging.level.org.springframework.security=DEBUG
springdoc.swagger-ui.path=/swagger